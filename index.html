<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stay aware.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --cream:#fdf8f0;
  --cream2:#faf3e6;
  --oat:#f5ead6;
  --oat2:#ede0c4;
  --ink:#2c1f0e;
  --ink2:#7a5c38;
  --ink3:#b89a76;
  --ink4:#d4bc9a;
  --honey:#e8a830;
  --honey2:#c98a18;
  --border:rgba(180,148,100,0.18);
  --borderh:rgba(180,148,100,0.36);

  --s1:#fef9ec;
  --s2:#fef4e4;
  --s3:#fdf0d8;
  --s4:#fdf6ee;
  --s5:#f9f5ee;
  --s6:#fef8f0;
}

body{
  background:var(--cream);
  background-image:
    radial-gradient(ellipse 800px 500px at 10% 0%,#fdf2d0 0%,transparent 65%),
    radial-gradient(ellipse 600px 500px at 90% 90%,#fde8c8 0%,transparent 65%),
    radial-gradient(ellipse 500px 300px at 55% 45%,#faf8f0 0%,transparent 60%);
  min-height:100vh;
  font-family:'DM Sans',sans-serif;
  color:var(--ink);
}

header{
  max-width:880px;
  margin:0 auto;
  padding:3.5rem 2rem 1.8rem;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:1rem;
}
.wordmark{
  font-family:'Playfair Display',serif;
  font-size:2.6rem;
  font-weight:700;
  color:var(--ink);
  line-height:1;
  letter-spacing:-0.02em;
}
.wordmark span{color:var(--honey2)}
.tagline{
  font-size:0.72rem;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:var(--ink3);
  font-weight:300;
  padding-bottom:0.35rem;
}

.setup-wrap{
  max-width:880px;
  margin:0 auto 1.5rem;
  padding:0 2rem;
}
.setup-row{
  background:rgba(255,252,244,0.8);
  border:1px dashed var(--oat2);
  border-radius:12px;
  padding:0.85rem 1.2rem;
  display:flex;
  align-items:center;
  gap:0.8rem;
  flex-wrap:wrap;
}
.setup-lbl{font-size:0.76rem;color:var(--ink2);font-weight:500;white-space:nowrap;letter-spacing:0.05em}
.setup-row input{
  flex:1;
  min-width:180px;
  border:1px solid var(--oat2);
  border-radius:8px;
  padding:0.38rem 0.75rem;
  font-size:0.8rem;
  color:var(--ink);
  background:#fffdf8;
  outline:none;
  font-family:'DM Sans',sans-serif;
  transition:border-color 0.15s;
}
.setup-row input:focus{border-color:var(--honey)}
.btn-connect{
  padding:0.38rem 1rem;
  border-radius:20px;
  border:1px solid var(--honey2);
  background:transparent;
  color:var(--honey2);
  font-size:0.76rem;
  cursor:pointer;
  font-family:'DM Sans',sans-serif;
  font-weight:500;
  white-space:nowrap;
  letter-spacing:0.05em;
  transition:all 0.15s;
}
.btn-connect:hover{background:var(--honey2);color:#fff}

.compose-wrap{
  max-width:880px;
  margin:0 auto 2.5rem;
  padding:0 2rem;
}
.compose{
  background:rgba(255,253,246,0.9);
  border:1px solid var(--oat2);
  border-radius:16px;
  overflow:hidden;
  transition:border-color 0.2s,box-shadow 0.2s;
  box-shadow:0 2px 12px rgba(180,140,80,0.07);
}
.compose:focus-within{
  border-color:rgba(180,148,100,0.4);
  box-shadow:0 2px 20px rgba(180,140,80,0.13);
}
.compose textarea{
  width:100%;
  min-height:96px;
  padding:1.2rem 1.4rem 0.6rem;
  border:none;
  background:transparent;
  font-family:'Lora',serif;
  font-size:1rem;
  color:var(--ink);
  resize:none;
  outline:none;
  line-height:1.9;
}
.compose textarea::placeholder{
  color:var(--ink4);
  font-style:italic;
}
.compose-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0.55rem 1.2rem 0.7rem;
  border-top:1px solid var(--border);
}
.cc{font-size:0.7rem;color:var(--ink4);letter-spacing:0.05em}
.btn-pin{
  padding:0.4rem 1.25rem;
  border-radius:20px;
  border:none;
  background:var(--ink);
  color:var(--cream);
  font-size:0.78rem;
  font-family:'DM Sans',sans-serif;
  font-weight:500;
  cursor:pointer;
  letter-spacing:0.08em;
  transition:background 0.15s,transform 0.12s;
}
.btn-pin:hover{background:var(--ink2);transform:translateY(-1px)}
.btn-pin:active{transform:translateY(0)}
.btn-pin:disabled{opacity:0.35;cursor:not-allowed;transform:none}

.section-lbl{
  max-width:880px;
  margin:0 auto 1rem;
  padding:0 2rem;
  font-size:0.68rem;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:var(--ink3);
}

.board{
  max-width:880px;
  margin:0 auto;
  padding:0 2rem 5rem;
  columns:3 210px;
  column-gap:14px;
}
@media(max-width:540px){
  .board{columns:1}
  .wordmark{font-size:2.2rem}
  header{padding:2.5rem 1.5rem 1.5rem}
  .compose-wrap,.setup-wrap,.section-lbl{padding:0 1.5rem}
  .board{padding:0 1.5rem 4rem}
}

.note{
  break-inside:avoid;
  margin-bottom:14px;
  border-radius:3px 12px 12px 12px;
  padding:1rem 1.1rem 0.9rem;
  position:relative;
  border:1px solid transparent;
  transition:transform 0.22s,box-shadow 0.22s;
}
.note:hover{
  transform:translateY(-5px) rotate(-0.5deg);
  box-shadow:0 14px 36px rgba(120,80,20,0.12);
  z-index:2;
}
.note.c0{background:#fefaee;border-color:rgba(200,168,100,0.2)}
.note.c1{background:#fef6e4;border-color:rgba(200,160,90,0.2)}
.note.c2{background:#fffcf5;border-color:rgba(200,175,115,0.18)}
.note.c3{background:#fdf9f0;border-color:rgba(190,165,105,0.2)}
.note.c4{background:#fef8e8;border-color:rgba(200,170,100,0.2)}
.note.c5{background:#fffdf0;border-color:rgba(205,175,110,0.18)}

.note-tape{
  position:absolute;
  top:-10px;
  left:50%;
  transform:translateX(-50%);
  width:36px;
  height:18px;
  background:rgba(240,220,170,0.55);
  border-radius:2px;
  border:1px solid rgba(200,168,100,0.25);
}

.parent-ref{
  font-size:0.68rem;
  color:var(--ink3);
  margin-bottom:0.55rem;
  display:flex;
  align-items:center;
  gap:4px;
  font-style:italic;
}
.note-body{
  font-family:'Lora',serif;
  font-size:0.9rem;
  line-height:1.88;
  color:var(--ink);
  letter-spacing:0.01em;
  margin-bottom:0.85rem;
  white-space:pre-wrap;
  word-break:break-all;
}
.note-foot{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
  justify-content:space-between;
}
.note-time{
  font-size:0.66rem;
  color:var(--ink4);
  letter-spacing:0.07em;
}
.badge{
  font-size:0.62rem;
  padding:2px 8px;
  border-radius:10px;
  background:rgba(180,148,80,0.13);
  color:var(--ink2);
  letter-spacing:0.07em;
}
.count-btn{
  margin-top:0.65rem;
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:0.68rem;
  padding:3px 10px 3px 8px;
  border-radius:10px;
  border:1px solid var(--oat2);
  background:rgba(255,252,244,0.7);
  color:var(--ink2);
  cursor:pointer;
  font-family:'DM Sans',sans-serif;
  letter-spacing:0.04em;
  transition:all 0.18s;
  user-select:none;
}
.count-btn:hover{border-color:var(--honey2);background:#fffcf5;color:var(--honey2)}
.count-btn:active{transform:scale(0.95)}
.count-btn .n{
  font-size:0.78rem;
  font-weight:500;
  color:var(--ink);
  min-width:10px;
  text-align:center;
}
.count-btn.hot{border-color:rgba(180,130,30,0.35);background:rgba(255,248,220,0.8)}
.count-btn.hot .n{color:var(--honey2)}

.status{
  max-width:880px;
  margin:0 auto;
  padding:3rem 2rem;
  text-align:center;
  font-size:0.8rem;
  color:var(--ink3);
  letter-spacing:0.12em;
  font-style:italic;
}

.snack{
  position:fixed;
  bottom:2rem;
  left:50%;
  transform:translateX(-50%) translateY(60px);
  background:var(--ink);
  color:rgba(255,252,240,0.92);
  padding:0.5rem 1.3rem;
  border-radius:20px;
  font-size:0.76rem;
  letter-spacing:0.08em;
  font-family:'DM Sans',sans-serif;
  transition:transform 0.28s cubic-bezier(.34,1.56,.64,1);
  z-index:600;
  white-space:nowrap;
  pointer-events:none;
}
.snack.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div>
    <div class="wordmark">Stay <span>aware.</span></div>
  </div>
  <div class="tagline">One bit at a time.</div>
</header>

<div class="setup-wrap" id="setupWrap">
  <div class="setup-row">
    <span class="setup-lbl">Apps Script URL</span>
    <input type="text" id="urlInput" placeholder="https://script.google.com/macros/s/…/exec" />
    <button class="btn-connect" onclick="saveUrl()">connect</button>
  </div>
</div>

<div class="compose-wrap">
  <div class="compose">
    <textarea id="noteInput" placeholder="remember …" maxlength="300"></textarea>
    <div class="compose-bar">
      <span class="cc" id="cc">0 / 300</span>
      <button class="btn-pin" id="pinBtn" onclick="addNote()">pin it</button>
    </div>
  </div>
</div>

<div class="section-lbl" id="boardLbl" style="display:none">on the board</div>

<div id="boardWrap">
  <div class="status" id="statusMsg">connect your sheet above to get started</div>
</div>

<div class="snack" id="snack"></div>

<script>
const COLS=['c0','c1','c2','c3','c4','c5'];
let notes=[];
let API=localStorage.getItem('nts_url')||'';

function boot(){
  if(API){
    document.getElementById('urlInput').value=API;
    document.getElementById('setupWrap').style.display='none';
    load();
  }
  document.getElementById('noteInput').addEventListener('input',function(){
    document.getElementById('cc').textContent=this.value.length+' / 300';
  });
}

function saveUrl(){
  const v=document.getElementById('urlInput').value.trim();
  if(!v) return toast('paste your URL first');
  API=v; localStorage.setItem('nts_url',v);
  document.getElementById('setupWrap').style.display='none';
  toast('connected'); load();
}

async function load(){
  setStatus('loading…');
  try{
    const data=await jsonp(API+'?action=get&callback=__cb__');
    notes=data.notes||[];
    render(notes);
  }catch(e){setStatus('could not reach the sheet — check your URL')}
}

function jsonp(url){
  return new Promise((resolve,reject)=>{
    const name='__cb__';
    if(window[name]) delete window[name];
    const s=document.createElement('script');
    const timer=setTimeout(()=>{s.remove();reject(new Error('timeout'))},8000);
    window[name]=function(data){clearTimeout(timer);s.remove();delete window[name];resolve(data)};
    s.onerror=()=>{clearTimeout(timer);s.remove();reject(new Error('load error'))};
    s.src=url;
    document.head.appendChild(s);
  });
}

function render(list){
  const wrap=document.getElementById('boardWrap');
  const lbl=document.getElementById('boardLbl');
  if(!list.length){
    lbl.style.display='none';
    wrap.innerHTML='<div class="status" id="statusMsg">nothing here yet — write something worth keeping</div>';
    return;
  }
  lbl.style.display='block';
  const sorted=[...list].sort((a,b)=>{
    const rc=(x)=>parseInt(x.remind_count)||0;
    if(rc(b)!==rc(a)) return rc(b)-rc(a);
    return new Date(b.timestamp)-new Date(a.timestamp);
  });
  const board=document.createElement('div');
  board.className='board';
  board.innerHTML=sorted.map((n,i)=>{
    const c=COLS[i%COLS.length];
    const rc=parseInt(n.remind_count)||0;
    const hot=rc>=3?'hot':'';
    return`<div class="note ${c}">
      <div class="note-tape"></div>
      <div class="note-body">${esc(n.content)}</div>
      <div class="note-foot">
        <span class="note-time">${fmt(n.timestamp)}</span>
      </div>
      <div><button class="count-btn ${hot}" onclick="bump('${n.id}')" title="click to remind yourself again">
        <span>&#8635;</span><span class="n">${rc}</span>
      </button></div>
    </div>`;
  }).join('');
  wrap.innerHTML='';
  wrap.appendChild(board);
}

function setStatus(msg){
  document.getElementById('boardLbl').style.display='none';
  document.getElementById('boardWrap').innerHTML=`<div class="status" id="statusMsg">${msg}</div>`;
}

async function addNote(){
  const txt=document.getElementById('noteInput').value.trim();
  if(!txt) return toast('write something first');
  if(!API) return toast('connect your sheet first');
  const btn=document.getElementById('pinBtn');
  btn.disabled=true; btn.textContent='pinning…';
  try{
    await fetch(API,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'add',content:txt,timestamp:new Date().toISOString(),parent_id:'',remind_count:0})});
    document.getElementById('noteInput').value='';
    document.getElementById('cc').textContent='0 / 300';
    toast('pinned');
    await load();
  }catch{toast('something went wrong')}
  btn.disabled=false; btn.textContent='pin it';
}

async function bump(id){
  const n=notes.find(x=>x.id===id); if(!n) return;
  const newCount=(parseInt(n.remind_count)||0)+1;
  n.remind_count=newCount;
  render(notes);
  try{
    await fetch(API,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'increment',id})});
  }catch{toast('could not save — check connection')}
}

function fmt(ts){
  if(!ts) return'';
  const d=new Date(ts),now=new Date(),diff=now-d;
  const m=Math.floor(diff/60000),h=Math.floor(diff/3600000),dy=Math.floor(diff/86400000);
  if(m<1) return'just now';
  if(m<60) return m+'m ago';
  if(h<24) return h+'h ago';
  if(dy<7) return dy+'d ago';
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function toast(msg){
  const s=document.getElementById('snack');
  s.textContent=msg; s.classList.add('show');
  setTimeout(()=>s.classList.remove('show'),2200);
}

boot();
</script>
</body>
</html>
