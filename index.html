<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stay aware.</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf6ef;
  --ink:#1a1208;
  --ink2:#5c4a2a;
  --ink3:#a08858;
  --ink4:#c8ae82;
  --ink5:#e2d4b8;
  --gold:#c9a96e;
  --gold2:#b8922a;
  --blue:#6a9fc0;
  --surface:#fffdf7;
  --border:rgba(160,136,88,0.16);
  --borderh:rgba(160,136,88,0.32);
  --n0:#fffcf0;--n1:#fef9e6;--n2:#fdf6e0;--n3:#fef8ec;--n4:#fffae8;--n5:#fdf5e2;
}
html{scroll-behavior:smooth;overflow-x:hidden}
body{
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 70% 55% at 8% 0%,#f8edcc 0%,transparent 60%),
    radial-gradient(ellipse 55% 50% at 92% 95%,#f5e4c0 0%,transparent 60%),
    radial-gradient(ellipse 40% 40% at 50% 50%,#faf8f2 0%,transparent 70%);
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  color:var(--ink);
}

header{
  max-width:900px;
  margin:0 auto;
  padding:4rem 2.5rem 2.2rem;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:1rem;
  border-bottom:1px solid var(--border);
}
.logo{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
  font-size:2.6rem;
  font-weight:600;
  line-height:1;
  letter-spacing:0.04em;
  color:var(--ink);
}
.logo em{font-style:normal;color:var(--blue);font-weight:400;letter-spacing:0.08em}
.sub{
  font-size:0.65rem;
  letter-spacing:0.3em;
  text-transform:uppercase;
  color:var(--ink4);
  padding-bottom:0.3rem;
}

.setup{max-width:900px;margin:1.8rem auto 0;padding:0 2.5rem}
.setup-inner{
  display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;
  padding:0.85rem 1.2rem;
  background:rgba(255,252,240,0.7);
  border:1px dashed var(--borderh);
  border-radius:10px;
}
.setup-lbl{font-size:0.72rem;color:var(--ink2);font-weight:500;letter-spacing:0.06em;white-space:nowrap}
.setup-inner input{
  flex:1;min-width:180px;height:32px;
  border:1px solid var(--border);border-radius:6px;
  padding:0 0.7rem;font-size:0.77rem;color:var(--ink);
  background:#fffdf8;outline:none;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  transition:border-color 0.15s;
}
.setup-inner input:focus{border-color:var(--gold)}
.btn-sm{
  height:32px;padding:0 1rem;border-radius:6px;
  border:1px solid var(--gold);background:transparent;color:var(--gold);
  font-size:0.72rem;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  font-weight:500;letter-spacing:0.07em;cursor:pointer;white-space:nowrap;transition:all 0.15s;
}
.btn-sm:hover{background:var(--gold);color:#fff}

.compose-wrap{max-width:900px;margin:1.8rem auto 0;padding:0 2.5rem}
.compose{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  transition:border-color 0.2s,box-shadow 0.2s;
}
.compose:focus-within{
  border-color:var(--borderh);
  box-shadow:0 4px 28px rgba(160,120,40,0.08);
}
.compose textarea{
  display:block;width:100%;min-height:88px;
  padding:1.15rem 1.5rem 0.6rem;
  border:none;background:transparent;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  font-size:1rem;font-weight:400;color:var(--ink);
  resize:none;outline:none;line-height:1.75;letter-spacing:0;
}
.compose textarea::placeholder{color:var(--ink5);font-style:normal}
.compose-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0.5rem 1.2rem 0.65rem;
  border-top:1px solid var(--border);
}
.cc{font-size:0.66rem;color:var(--ink5);letter-spacing:0.05em}
.btn-post{
  height:33px;padding:0 1.4rem;border-radius:17px;border:none;
  background:var(--ink);color:#faf6ef;
  font-size:0.74rem;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  font-weight:500;letter-spacing:0.1em;cursor:pointer;
  transition:background 0.15s,transform 0.12s;
}
.btn-post:hover{background:var(--ink2);transform:translateY(-1px)}
.btn-post:active{transform:translateY(0)}
.btn-post:disabled{opacity:0.28;cursor:not-allowed;transform:none}

.board-hd{
  max-width:900px;margin:3rem auto 1.2rem;padding:0 2.5rem;
  display:flex;align-items:center;gap:1rem;
}
.board-lbl{font-size:0.63rem;letter-spacing:0.28em;text-transform:uppercase;color:var(--ink4)}
.board-rule{flex:1;height:1px;background:var(--border)}

.board{
  max-width:900px;margin:0 auto;
  padding:0 2.5rem 6rem;
  columns:3 200px;column-gap:16px;
}

@media(max-width:640px){
  header,.setup,.compose-wrap,.board-hd,.board{padding-left:1.4rem;padding-right:1.4rem}
  .logo{font-size:2.4rem}
  .board{columns:1}
  header{padding-top:2.8rem}
}

.note{
  break-inside:avoid;margin-bottom:16px;
  padding:1.1rem 1.2rem 1rem;
  border-radius:2px 12px 12px 12px;
  border:1px solid transparent;
  position:relative;
  transition:transform 0.25s cubic-bezier(.22,.68,0,1.2),box-shadow 0.25s;
}
.note:hover{transform:translateY(-6px) rotate(-0.3deg);box-shadow:0 18px 44px rgba(100,72,20,0.1);z-index:2}
.note.c0{background:var(--n0);border-color:rgba(200,174,120,0.2)}
.note.c1{background:var(--n1);border-color:rgba(196,168,112,0.2)}
.note.c2{background:var(--n2);border-color:rgba(192,164,108,0.2)}
.note.c3{background:var(--n3);border-color:rgba(200,172,118,0.2)}
.note.c4{background:var(--n4);border-color:rgba(198,170,114,0.2)}
.note.c5{background:var(--n5);border-color:rgba(194,166,110,0.2)}

.tape{
  position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  width:32px;height:16px;
  background:rgba(232,216,168,0.52);
  border-radius:1px;border:1px solid rgba(196,172,116,0.26);
}
.note-body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  font-size:0.92rem;font-weight:400;line-height:1.75;
  color:var(--ink);letter-spacing:0;
  margin-bottom:0.85rem;white-space:pre-wrap;word-break:break-all;
}
.note-foot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.note-time{font-size:0.62rem;color:var(--ink5);letter-spacing:0.08em}
.note-actions{display:flex;align-items:center;gap:6px}
.bump{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 9px 2px 7px;border-radius:8px;
  border:1px solid rgba(180,148,80,0.22);
  background:rgba(255,250,232,0.55);
  color:var(--ink3);font-size:0.65rem;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  letter-spacing:0.05em;cursor:pointer;user-select:none;
  transition:all 0.18s;
}
.bump:hover{border-color:var(--gold);color:var(--gold);background:rgba(255,248,215,0.9)}
.bump:active{transform:scale(0.92)}
.bump .num{
  font-size:0.72rem;font-weight:500;color:var(--ink2);
  min-width:8px;text-align:center;transition:color 0.15s;
}
.bump.warm{border-color:rgba(184,134,42,0.34);background:rgba(255,246,210,0.8)}
.bump.warm .num{color:var(--gold)}
.bump.hot{border-color:rgba(184,134,42,0.52);background:rgba(254,243,190,0.92)}
.bump.hot .num{color:var(--gold2);font-weight:600}

.status-wrap{
  max-width:900px;margin:0 auto;padding:4rem 2.5rem;text-align:center;
}
.status-wrap p{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  font-style:italic;font-size:0.9rem;color:var(--ink4);letter-spacing:0.04em;
}

.del{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:6px;
  border:1px solid transparent;background:transparent;
  color:var(--ink5);cursor:pointer;transition:all 0.15s;flex-shrink:0;
}
.del:hover{border-color:rgba(180,60,60,0.2);background:rgba(255,240,240,0.8);color:#c04040}
.del:active{transform:scale(0.9)}

.veil{
  display:none;position:fixed;inset:0;
  background:rgba(26,18,8,0.28);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  z-index:400;align-items:center;justify-content:center;padding:1.5rem;
}
.veil.open{display:flex}
.modal{
  background:#fffdf6;
  border:1px solid var(--border);
  border-radius:18px;
  padding:1.6rem 1.5rem 1.3rem;
  max-width:340px;width:100%;
  box-shadow:0 20px 56px rgba(100,60,10,0.14);
}
.modal-eye{
  font-size:0.64rem;letter-spacing:0.22em;text-transform:uppercase;
  color:var(--ink4);margin-bottom:0.4rem;
}
.modal-title{
  font-size:1.1rem;font-weight:600;color:var(--ink);
  margin-bottom:0.75rem;letter-spacing:-0.01em;
}
.modal-preview{
  background:var(--n2);border:1px solid rgba(200,168,100,0.18);
  border-radius:10px;padding:0.8rem 0.95rem;
  font-size:0.88rem;color:var(--ink2);line-height:1.7;
  margin-bottom:1.2rem;
  max-height:120px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;
}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.btn-cancel{
  height:33px;padding:0 1rem;border-radius:10px;
  border:1px solid var(--border);background:transparent;
  color:var(--ink3);font-size:0.76rem;cursor:pointer;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  transition:border-color 0.15s;
}
.btn-cancel:hover{border-color:var(--ink3);color:var(--ink2)}
.btn-del-confirm{
  height:33px;padding:0 1.1rem;border-radius:10px;border:none;
  background:#c04040;color:#fff;font-size:0.76rem;cursor:pointer;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  font-weight:500;letter-spacing:0.04em;transition:background 0.15s;
}
.btn-del-confirm:hover{background:#a83535}

/* ── confetti ── */
@keyframes burst{
  0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}
}
.particle{
  position:fixed;
  width:6px;height:6px;
  border-radius:50%;
  pointer-events:none;
  z-index:1000;
  animation:burst 0.7s cubic-bezier(.25,.46,.45,.94) forwards;
}

.snack{
  position:fixed;bottom:2rem;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:rgba(250,246,235,0.92);
  padding:0.46rem 1.3rem;border-radius:20px;
  font-size:0.7rem;letter-spacing:0.09em;
  transition:transform 0.28s cubic-bezier(.34,1.56,.64,1);
  z-index:999;white-space:nowrap;pointer-events:none;
}
.snack.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="logo">Stay <em>aware.</em></div>
  <div class="sub">One bit at a time.</div>
</header>

<div class="setup" id="setupWrap">
  <div class="setup-inner">
    <span class="setup-lbl">Apps Script URL</span>
    <input type="text" id="urlInput" placeholder="https://script.google.com/macros/s/…/exec" />
    <button class="btn-sm" onclick="saveUrl()">connect</button>
  </div>
</div>

<div class="compose-wrap">
  <div class="compose">
    <textarea id="noteInput" placeholder="remember …" maxlength="300"></textarea>
    <div class="compose-bar">
      <span class="cc" id="cc">0 / 300</span>
      <button class="btn-post" id="pinBtn" onclick="addNote()">pin it</button>
    </div>
  </div>
</div>

<div id="boardHeader" style="display:none">
  <div class="board-hd">
    <span class="board-lbl">on the board</span>
    <div class="board-rule"></div>
  </div>
</div>
<div id="boardWrap">
  <div class="status-wrap"><p>connect your sheet above to begin</p></div>
</div>

<div class="veil" id="veil">
  <div class="modal">
    <div class="modal-eye">delete note</div>
    <div class="modal-title">Remove this?</div>
    <div class="modal-preview" id="modalPreview"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">keep it</button>
      <button class="btn-del-confirm" onclick="confirmDelete()">delete</button>
    </div>
  </div>
</div>

<div class="snack" id="snack"></div>

<script>
const COLS=['c0','c1','c2','c3','c4','c5'];
let notes=[];
let API=localStorage.getItem('nts_url')||'';

function boot(){
  if(API){
    document.getElementById('urlInput').value=API;
    document.getElementById('setupWrap').style.display='none';
    load();
  }
  document.getElementById('noteInput').addEventListener('input',function(){
    document.getElementById('cc').textContent=this.value.length+' / 300';
  });
}

function saveUrl(){
  const v=document.getElementById('urlInput').value.trim();
  if(!v){toast('paste your URL first');return}
  API=v;localStorage.setItem('nts_url',v);
  document.getElementById('setupWrap').style.display='none';
  toast('connected');load();
}

function jsonpFetch(url){
  return new Promise((resolve,reject)=>{
    const cb='__nts'+Date.now();
    const s=document.createElement('script');
    const t=setTimeout(()=>{cleanup();reject(new Error('timeout'))},10000);
    function cleanup(){clearTimeout(t);s.remove();try{delete window[cb]}catch(e){window[cb]=void 0}}
    window[cb]=function(d){cleanup();resolve(d)};
    s.onerror=()=>{cleanup();reject(new Error('load error'))};
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
    document.head.appendChild(s);
  });
}

async function load(){
  setStatus('loading…');
  try{
    const data=await jsonpFetch(API+'?action=get');
    notes=data.notes||[];
    render(notes);
  }catch(e){
    setStatus('could not reach the sheet — please redeploy your Apps Script as a new version, then try again');
  }
}

function render(list){
  const bh=document.getElementById('boardHeader');
  const wrap=document.getElementById('boardWrap');
  if(!list.length){
    bh.style.display='none';
    wrap.innerHTML='<div class="status-wrap"><p>nothing here yet</p></div>';
    return;
  }
  bh.style.display='block';
  const sorted=[...list].sort((a,b)=>{
    const rc=x=>parseInt(x.remind_count)||0;
    return rc(b)!==rc(a)?rc(b)-rc(a):new Date(b.timestamp)-new Date(a.timestamp);
  });
  const board=document.createElement('div');
  board.className='board';
  board.innerHTML=sorted.map((n,i)=>{
    const c=COLS[i%COLS.length];
    const rc=parseInt(n.remind_count)||0;
    const cls=rc>=5?'hot':rc>=2?'warm':'';
    return`<div class="note ${c}">
      <div class="tape"></div>
      <div class="note-body">${esc(n.content)}</div>
      <div class="note-foot">
        <span class="note-time">${fmt(n.timestamp)}</span>
        <div class="note-actions">
          <button class="bump ${cls}" onclick="bump('${n.id}')">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 5a3.5 3.5 0 1 1-.9-2.3"/><polyline points="8.5,1.2 8.5,3.2 6.5,3.2"/></svg>
            <span class="num">${rc}</span>
          </button>
          <button class="del" onclick="askDelete('${n.id}')" title="delete">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="2" y1="2" x2="9" y2="9"/><line x1="9" y1="2" x2="2" y2="9"/></svg>
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
  wrap.innerHTML='';
  wrap.appendChild(board);
}

function setStatus(msg){
  document.getElementById('boardHeader').style.display='none';
  document.getElementById('boardWrap').innerHTML=`<div class="status-wrap"><p>${msg}</p></div>`;
}

async function addNote(){
  const txt=document.getElementById('noteInput').value.trim();
  if(!txt){toast('write something first');return}
  if(!API){toast('connect your sheet first');return}
  const btn=document.getElementById('pinBtn');
  btn.disabled=true;btn.textContent='pinning…';
  try{
    await fetch(API,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'add',content:txt,timestamp:new Date().toISOString(),parent_id:'',remind_count:0})});
    document.getElementById('noteInput').value='';
    document.getElementById('cc').textContent='0 / 300';
    confetti(btn);
    toast('pinned');
    setTimeout(load,900);
  }catch(e){toast('could not save')}
  btn.disabled=false;btn.textContent='pin it';
}

async function bump(id){
  const n=notes.find(x=>x.id===id);if(!n)return;
  n.remind_count=(parseInt(n.remind_count)||0)+1;
  render(notes);
  try{
    await fetch(API,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'increment',id})});
  }catch(e){}
}

function fmt(ts){
  if(!ts)return'';
  const d=new Date(ts),now=new Date(),diff=now-d;
  const m=Math.floor(diff/60000),h=Math.floor(diff/3600000),dy=Math.floor(diff/86400000);
  if(m<1)return'just now';
  if(m<60)return m+'m ago';
  if(h<24)return h+'h ago';
  if(dy<7)return dy+'d ago';
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function toast(msg){
  const s=document.getElementById('snack');
  s.textContent=msg;s.classList.add('show');
  setTimeout(()=>s.classList.remove('show'),2400);
}

function confetti(originEl){
  const rect=originEl.getBoundingClientRect();
  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;
  const colors=['#7ab8e8','#5a9fd4','#a8d0f0','#4a8fc0','#90c4e8','#b8d8f4','#6aaad8'];
  for(let i=0;i<18;i++){
    const p=document.createElement('div');
    p.className='particle';
    const angle=Math.random()*Math.PI*2;
    const dist=40+Math.random()*60;
    p.style.cssText=`
      left:${cx-3}px;top:${cy-3}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      --tx:${Math.cos(angle)*dist}px;
      --ty:${Math.sin(angle)*dist}px;
      animation-duration:${0.5+Math.random()*0.4}s;
      animation-delay:${Math.random()*0.08}s;
      width:${4+Math.random()*5}px;
      height:${4+Math.random()*5}px;
      border-radius:${Math.random()>0.5?'50%':'2px'};
    `;
    document.body.appendChild(p);
    p.addEventListener('animationend',()=>p.remove());
  }
}

function askDelete(id){
  const n=notes.find(x=>x.id===id);if(!n)return;
  pendingDeleteId=id;
  document.getElementById('modalPreview').textContent=n.content;
  document.getElementById('veil').classList.add('open');
}

function closeModal(){
  document.getElementById('veil').classList.remove('open');
  pendingDeleteId=null;
}

async function confirmDelete(){
  if(!pendingDeleteId)return;
  const id=pendingDeleteId;
  closeModal();
  notes=notes.filter(x=>x.id!==id);
  render(notes);
  try{
    await fetch(API,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'delete',id})});
    toast('deleted');
  }catch(e){toast('could not delete')}
}

document.getElementById('veil').addEventListener('click',function(e){
  if(e.target===this)closeModal();
});

boot();
</script>
</body>
</html>
